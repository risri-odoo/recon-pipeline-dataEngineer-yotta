[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon"
version = "0.1.0"
description = "Source-vs-target data reconciliation pipeline (stdlib + SQLite medallion)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recon = "recon.presentation.cli:main"

[tool.setuptools.packages.find]
include = ["recon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
